name: Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: ./create_nar.sh
      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          path: ghost_in_a_nutshell.nar
          archive: false
